# Site-owned font pack matching Source Themes Academic 4.5.
# Keeping this in data/ means it survives Hugo Blox module upgrades.
hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Legacy Academic"
    vendor: "site"
    version: "1.0.0"
    license: "OFL-1.1"
    description: "Montserrat headings with Roboto body and navigation text"

  families:
    heading: "Montserrat"
    body: "Roboto"
    nav: "Roboto"
    code: "Roboto Mono"

  weights:
    heading: [400, 500, 700]
    body: [300, 400, 700]
    nav: [400, 700]
    code: [400, 700]

  leading:
    heading: 1.2
    body: 1.65
    code: 1.5

  tracking:
    heading: "0"
    body: "0"
