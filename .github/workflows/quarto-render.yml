name: Render and verify Quarto site

on:
  push:
    branches: [fresh-quarto-academic]
  pull_request:
    branches: [fresh-quarto-academic]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        run: quarto render
      - name: Verify rendered site
        run: bash scripts/verify-site.sh
